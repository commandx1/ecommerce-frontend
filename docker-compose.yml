services:
  dentb2b-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: dentb2b-frontend:latest
    container_name: dentb2b-frontend
    ports:
      - "3000:8080"
    environment:
      - BACKEND_URL=http://dentb2b-backend:8080
      - NEXT_PUBLIC_BACKEND_URL=http://dentb2b-backend:8080
    networks:
      - dentb2b-net

networks:
  dentb2b-net:
    external: true
