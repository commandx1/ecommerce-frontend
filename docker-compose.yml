services:
  dentb2b-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://ecommerce-api:8080
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    image: dentb2b-frontend:latest
    container_name: dentb2b-frontend
    ports:
      - "3000:8080"
    environment:
      - BACKEND_URL=http://ecommerce-api:8080
      - HOSTNAME=0.0.0.0
      - PORT=8080
    networks:
      - dentb2b-net

networks:
  dentb2b-net:
    external: true
